{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Technologies | RepoReadme AI</title>

    <link rel="stylesheet"
          href="{% static 'generator/css/style.css' %}">
</head>

<body class="technology-page">

    <nav class="landing-nav">

        <div class="brand">
            <span class="brand-icon">✦</span>
            <span>reporeadme</span>
        </div>

        <div class="theme-step">
            03 / 06
        </div>

    </nav>


    <main class="technology-container">

        <div class="technology-heading">

            <div class="eyebrow">
                <span>03</span>
                TECHNOLOGY STACK
            </div>

            <h1>
                What are you
                <span>building with?</span>
            </h1>

            <p>
                Select the technologies used in your project.
                We'll use them to create your README.
            </p>

        </div>


        <!-- LANGUAGES -->

        <section class="tech-section">

            <div class="tech-section-title">
                <span>01</span>
                LANGUAGES
            </div>

            <div class="tech-grid">

                <label class="tech-card">
                    <input type="checkbox" value="Python">
                    <div class="tech-icon">🐍</div>
                    <div>
                        <strong>Python</strong>
                        <small>Python</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="JavaScript">
                    <div class="tech-icon">JS</div>
                    <div>
                        <strong>JavaScript</strong>
                        <small>JavaScript</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="TypeScript">
                    <div class="tech-icon">TS</div>
                    <div>
                        <strong>TypeScript</strong>
                        <small>TypeScript</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="C++">
                    <div class="tech-icon">C++</div>
                    <div>
                        <strong>C++</strong>
                        <small>C++</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="C">
                    <div class="tech-icon">C</div>
                    <div>
                        <strong>C</strong>
                        <small>C</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Java">
                    <div class="tech-icon">☕</div>
                    <div>
                        <strong>Java</strong>
                        <small>Java</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Go">
                    <div class="tech-icon">Go</div>
                    <div>
                        <strong>Go</strong>
                        <small>Golang</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Rust">
                    <div class="tech-icon">Rs</div>
                    <div>
                        <strong>Rust</strong>
                        <small>Rust</small>
                    </div>
                </label>

            </div>

        </section>


        <!-- FRAMEWORKS -->

        <section class="tech-section">

            <div class="tech-section-title">
                <span>02</span>
                FRAMEWORKS & RUNTIMES
            </div>

            <div class="tech-grid">

                <label class="tech-card">
                    <input type="checkbox" value="React">
                    <div class="tech-icon">⚛</div>
                    <div>
                        <strong>React</strong>
                        <small>React.js</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Next.js">
                    <div class="tech-icon">N</div>
                    <div>
                        <strong>Next.js</strong>
                        <small>Next.js</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Django">
                    <div class="tech-icon">Dj</div>
                    <div>
                        <strong>Django</strong>
                        <small>Python</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Flask">
                    <div class="tech-icon">Fl</div>
                    <div>
                        <strong>Flask</strong>
                        <small>Python</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="FastAPI">
                    <div class="tech-icon">Fa</div>
                    <div>
                        <strong>FastAPI</strong>
                        <small>Python</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Node.js">
                    <div class="tech-icon">⬢</div>
                    <div>
                        <strong>Node.js</strong>
                        <small>Runtime</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Express">
                    <div class="tech-icon">Ex</div>
                    <div>
                        <strong>Express</strong>
                        <small>Node.js</small>
                    </div>
                </label>

            </div>

        </section>


        <!-- DATABASES -->

        <section class="tech-section">

            <div class="tech-section-title">
                <span>03</span>
                DATABASES
            </div>

            <div class="tech-grid">

                <label class="tech-card">
                    <input type="checkbox" value="MongoDB">
                    <div class="tech-icon">M</div>
                    <div>
                        <strong>MongoDB</strong>
                        <small>NoSQL</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="PostgreSQL">
                    <div class="tech-icon">PG</div>
                    <div>
                        <strong>PostgreSQL</strong>
                        <small>SQL</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="MySQL">
                    <div class="tech-icon">SQL</div>
                    <div>
                        <strong>MySQL</strong>
                        <small>SQL</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="SQLite">
                    <div class="tech-icon">S</div>
                    <div>
                        <strong>SQLite</strong>
                        <small>Database</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Redis">
                    <div class="tech-icon">R</div>
                    <div>
                        <strong>Redis</strong>
                        <small>Cache</small>
                    </div>
                </label>

            </div>

        </section>


        <!-- TOOLS -->

        <section class="tech-section">

            <div class="tech-section-title">
                <span>04</span>
                TOOLS & SERVICES
            </div>

            <div class="tech-grid">

                <label class="tech-card">
                    <input type="checkbox" value="Git">
                    <div class="tech-icon">Git</div>
                    <div>
                        <strong>Git</strong>
                        <small>Version control</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Docker">
                    <div class="tech-icon">◆</div>
                    <div>
                        <strong>Docker</strong>
                        <small>Containers</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="AWS">
                    <div class="tech-icon">AWS</div>
                    <div>
                        <strong>AWS</strong>
                        <small>Cloud</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Firebase">
                    <div class="tech-icon">🔥</div>
                    <div>
                        <strong>Firebase</strong>
                        <small>Backend</small>
                    </div>
                </label>

                <label class="tech-card">
                    <input type="checkbox" value="Vercel">
                    <div class="tech-icon">▲</div>
                    <div>
                        <strong>Vercel</strong>
                        <small>Deployment</small>
                    </div>
                </label>

            </div>

        </section>


        <!-- ACTIONS -->

        <div class="technology-bottom">

            <button
                class="back-button"
                onclick="history.back()">
                ← Back
            </button>

            <button
                class="continue-button"
                id="technology-continue">

                Continue

                <span>→</span>

            </button>

        </div>

    </main>


    <script src="{% static 'generator/js/technologies.js' %}"></script>

</body>

</html>
