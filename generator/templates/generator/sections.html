{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>README Sections | RepoReadme AI</title>

    <link rel="stylesheet"
          href="{% static 'generator/css/style.css' %}">
</head>

<body class="sections-page">

    <nav class="landing-nav">

        <div class="brand">
            <span class="brand-icon">✦</span>
            <span>reporeadme</span>
        </div>

        <div class="theme-step">
            04 / 06
        </div>

    </nav>


    <main class="sections-container">

        <div class="sections-heading">

            <div class="eyebrow">
                <span>04</span>
                README STRUCTURE
            </div>

            <h1>
                What should your
                <span>README include?</span>
            </h1>

            <p>
                Pick the sections you want.
                We'll generate the content automatically.
            </p>

        </div>


        <div class="sections-list">

            <!-- ABOUT -->

            <label class="section-card selected">

                <input
                    type="checkbox"
                    value="About"
                    checked>

                <div class="section-number">
                    01
                </div>

                <div class="section-icon">
                    ✦
                </div>

                <div class="section-content">

                    <strong>About the Project</strong>

                    <span>
                        A concise explanation of what the project does
                        and why it exists.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>


            <!-- FEATURES -->

            <label class="section-card selected">

                <input
                    type="checkbox"
                    value="Features"
                    checked>

                <div class="section-number">
                    02
                </div>

                <div class="section-icon">
                    ◆
                </div>

                <div class="section-content">

                    <strong>Features</strong>

                    <span>
                        Highlight the main functionality and capabilities.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>


            <!-- TECH -->

            <label class="section-card selected">

                <input
                    type="checkbox"
                    value="Tech Stack"
                    checked>

                <div class="section-number">
                    03
                </div>

                <div class="section-icon">
                    &lt;/&gt;
                </div>

                <div class="section-content">

                    <strong>Tech Stack</strong>

                    <span>
                        Display the technologies used to build the project.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>


            <!-- INSTALLATION -->

            <label class="section-card selected">

                <input
                    type="checkbox"
                    value="Installation"
                    checked>

                <div class="section-number">
                    04
                </div>

                <div class="section-icon">
                    ↓
                </div>

                <div class="section-content">

                    <strong>Installation</strong>

                    <span>
                        Explain how someone can install the project locally.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>


            <!-- USAGE -->

            <label class="section-card selected">

                <input
                    type="checkbox"
                    value="Usage"
                    checked>

                <div class="section-number">
                    05
                </div>

                <div class="section-icon">
                    →
                </div>

                <div class="section-content">

                    <strong>Usage</strong>

                    <span>
                        Show users how to run and use the project.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>


            <!-- SCREENSHOTS -->

            <label class="section-card">

                <input
                    type="checkbox"
                    value="Screenshots">

                <div class="section-number">
                    06
                </div>

                <div class="section-icon">
                    ▣
                </div>

                <div class="section-content">

                    <strong>Screenshots</strong>

                    <span>
                        Add visual examples of the application.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>


            <!-- CONTRIBUTING -->

            <label class="section-card">

                <input
                    type="checkbox"
                    value="Contributing">

                <div class="section-number">
                    07
                </div>

                <div class="section-icon">
                    +
                </div>

                <div class="section-content">

                    <strong>Contributing</strong>

                    <span>
                        Explain how developers can contribute.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>


            <!-- LICENSE -->

            <label class="section-card selected">

                <input
                    type="checkbox"
                    value="License"
                    checked>

                <div class="section-number">
                    08
                </div>

                <div class="section-icon">
                    ©
                </div>

                <div class="section-content">

                    <strong>License</strong>

                    <span>
                        Show the project's license information.
                    </span>

                </div>

                <div class="section-check">
                    ✓
                </div>

            </label>

        </div>


        <div class="sections-bottom">

            <button
                class="back-button"
                onclick="history.back()">
                ← Back
            </button>

            <button
                class="continue-button"
                id="sections-continue">

                Continue

                <span>→</span>

            </button>

        </div>

    </main>


    <script src="{% static 'generator/js/sections.js' %}"></script>

</body>

</html>
